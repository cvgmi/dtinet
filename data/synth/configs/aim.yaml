# Synthetic isotropic-vs-anisotropic task; doubles as an end-to-end smoke test.
# Generate the data first: uv run python data/synth/generate.py
experiment:
  name: synth_aim
  seed: 0
  deterministic: true
  device: cuda
  output_dir: runs/synth/aim

data:
  root: data/synth
  ledger: training/ledger.json
  crop_xyz: [8, 8, 8]
  minimum_mask_retention: 1.0
  batch_size: 32
  num_workers: 0
  pin_memory: false

model:
  architecture: manifoldnet
  metric: aim
  num_classes: 2
  num_layers: 2
  num_channels: [4, 8]
  activation: null # AIM layers do not support activations
  kernel_size: 3
  padding: 1

optimizer:
  learning_rate: 0.01
  weight_decay: 0.0

training:
  epochs: 50 # AIM starts near the identity and is flat for the first epochs
  warmup_epochs: 0
  lr_schedule: constant
  early_stopping_patience: 10 # converges within ~15 epochs; keeps the smoke test short
  eval_train_every: 50
  grad_clip: 1.0
  selection_metric: balanced_accuracy
  amp: false
