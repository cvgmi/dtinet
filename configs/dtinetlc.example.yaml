experiment:
  name: dtinetlc_example
  seed: 42
  deterministic: true
  device: cuda
  output_dir: runs/dtinetlc_example

data:
  root: data
  ledger: training/ledger.json
  crop_xyz: [87, 96, 58]
  minimum_mask_retention: 0.99
  batch_size: 2
  num_workers: 4
  pin_memory: true

model:
  num_classes: 2
  num_layers: 4
  num_channels: [4, 8, 16, 16]
  activation: elu
  kernel_size: 3
  stride: 2
  padding: 1

optimizer:
  learning_rate: 0.0001
  weight_decay: 0.001

training:
  epochs: 50
  warmup_epochs: 5
  early_stopping_patience: 15
  eval_train_every: 2
  amp: true
