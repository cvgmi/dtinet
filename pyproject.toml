[project]
name = "dtinet"
version = "0.1.0"
description = "Geometry-aware neural networks for diffusion tensor imaging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nibabel>=5.4.2",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.12.1",
]

[project.scripts]
train = "dtinet.train:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E741"]
select = ["E", "F", "I"]
