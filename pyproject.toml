[project]
name = "dtinet"
version = "0.1.0"
description = "ManifoldNet primitives for SPD(3)-valued images (DTI) with pluggable metrics (LCM, LEM, AIM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nibabel>=5.4.2",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.12.1",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
src = ["src", "."]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E741"]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
# experiments/ is a top-level package run from the repository root
pythonpath = ["."]
testpaths = ["tests", "experiments/tests"]
